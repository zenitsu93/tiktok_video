name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgres://ci@localhost:5432/ci
          SESSION_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
          MEDIA_SECRET: ci-only-not-a-secret-ci-only-not-a-secret-2
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
